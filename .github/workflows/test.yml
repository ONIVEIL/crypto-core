name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # @noble/* 2.x (the crypto primitives this project builds on) require Node >= 20.19.0;
        # Node 18 fails at test runtime even though typecheck passes (TS checks types, not
        # execution). Keep this matrix in sync with the "engines" field in package.json.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
